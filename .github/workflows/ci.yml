# Runs on every pull request and every push to main.
# Deploys are handled by Vercel's GitHub integration; this workflow only checks the code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships to users. Dev-only tools and lower severities are left
      # to Dependabot's pull requests (.github/dependabot.yml) rather than blocking every PR.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Unit tests, failing if coverage drops below the floor in vitest.config.mts.
      - run: npm run test:coverage
      # `next build` also type-checks.
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every Playwright project uses Chromium.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app itself, with test-only settings.
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
