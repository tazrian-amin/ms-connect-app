# Weekly pull requests for outdated or vulnerable dependencies. Each one runs CI before review.
# Security fixes are opened as soon as an advisory is published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates together in one PR; major updates each get their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native Go compiler) has no JS API yet, so typescript-eslint
      # (via eslint-config-next) refuses to load and lint fails. Remove this once
      # typescript-eslint supports TS 7: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
